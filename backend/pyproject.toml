[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hbms-backend"
version = "0.1.0"
description = "Hotel Booking Management System backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "HBMS Team" }
]
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "motor>=3.7.0,<4.0.0",
  "pymongo>=4.14.0,<5.0.0",
  "python-jose[cryptography]>=3.5.0,<4.0.0",
  "pwdlib[argon2]>=0.2.0,<1.0.0",
  "email-validator>=2.3.0,<3.0.0",
  "pypdf>=5.0.0,<7.0.0",
  "mistralai>=1.9.0,<2.0.0",
  "apscheduler>=3.10.4,<4.0.0"
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "httpx>=0.28.0,<1.0.0",
  "ruff>=0.13.0,<1.0.0",
  "mypy>=1.17.0,<2.0.0",
  "types-python-jose>=3.5.0.20250531"
]

[tool.hatch.build.targets.wheel]
packages = ["src/hbms"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
